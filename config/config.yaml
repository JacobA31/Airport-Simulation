# Baseline configuration, SFMA simulation. Times in minutes unless noted.
experiment:
  name: baseline
  base_seed: 12345            # master seed (see rng.py)
  replications: 30            # use 10 for the pilot (--reps 10)
  horizon_days: 7             # horizon = horizon_days * 1440 min, empty start, no warm-up

inputs:                       # read by Variates
  commuter_arrival_rate_per_hour: 40
  provincial_demand:
    seats: {business: 40, coach: 140}
    occupancy_prob: {business: 0.75, coach: 0.85}
  provincial_lead_time:
    mean_min: 75
    variance_min2: 50
    lower_min: 0
    upper_min: 180
  bags_pmf:
    commuter: [0.70, 0.25, 0.05]
    provincial: [0.30, 0.50, 0.20]
  checkin:
    boarding_pass_mean_min: 2
    per_bag_mean_min: 1
    other_delay_prob: 1.0     # handout gives no probability: always applies
    other_delay_mean_min: 3
  security_mean_min: 3

resources:
  checkin_counters: {business: 1, coach: 3}       # at most 6 in total
  security_screeners: {business: 1, coach: 2}

flights:
  commuter:
    first_departure_min: 30   # on the half hour
    interval_min: 60
    seats: 40
  provincial:
    first_departure_min: 360  # ASSUMPTION: the midnight flight at t=0 is skipped, since
    interval_min: 360         # an empty system at t=0 has no one who arrived beforehand
  refund_threshold_min: 90    # refund if lead time >= this and the flight is missed

financial:
  ticket_price: {provincial_business: 1000, provincial_coach: 500, commuter: 200}
  flight_cost: {provincial: 12000, commuter: 1500}
  checkin_agent_wage_per_hour: 35
  staffing_cost_limit_fraction: 0.05   # check-in staffing cost / ticket revenue over the horizon

analysis:
  confidence_level: 0.95
  principal_kpis:
    - mean_security_wait_min
    - pct_provincial_missed
    - security_utilization
    - total_profit